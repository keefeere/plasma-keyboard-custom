# Build the Arch package and publish a GitHub release.
# Run it manually from the Actions tab ("Run workflow").
#
# The version is set automatically for every run:
#   pkgver = PROJECT_VERSION from CMakeLists.txt (e.g. 6.7.90)
#   pkgrel = workflow run number (monotonically increasing, so pacman
#            always sees an upgrade)
#   tag    = v<pkgver>-custom-r<pkgrel> (e.g. v6.7.90-custom-r12)
name: Build and Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        required: false
        default: false
      force:
        description: 'Skip the duplicate-package guard and release even if this exact payload was already published'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  # Needed to dispatch the pacman repository workflow below.
  actions: write

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    env:
      # Arch Linux Archive snapshot matching SteamOS 3.8 (Qt 6.9.1-5, KF6
      # 6.16.0, libplasma/Plasma 6.4.3). The build is pinned to Qt 6.9 because
      # the app uses Qt's private Gui and WaylandClient APIs, whose ABI is not
      # stable across Qt minor releases: SteamOS 3.8 ships Qt 6.9, so the
      # artefacts must be stamped Qt_6.9 and bind the exact private symbols Qt
      # 6.9 exports. A rolling container would stamp them Qt_6.11 (which SteamOS
      # rejects), and building against Qt 6.7/6.8 produces private symbols that
      # no longer exist in 6.9.
      ARCH_SNAPSHOT_DATE: '2025/07/28'
    container:
      image: archlinux:base-devel
    steps:
      - name: Pin package snapshot
        run: |
          printf 'Server = https://archive.archlinux.org/repos/%s/$repo/os/$arch\n' \
            "$ARCH_SNAPSHOT_DATE" > /etc/pacman.d/mirrorlist
          cat /etc/pacman.d/mirrorlist

      - name: Install git
        run: |
          # -Syyuu downgrades the whole rolling base-devel image to the pinned
          # snapshot, not just the newly needed packages.
          pacman -Syyuu --noconfirm --needed git
          # The build step chowns the workspace to an unprivileged user, which
          # makes git refuse to work here afterwards ("dubious ownership").
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: ver
        run: |
          base="$(sed -n 's/^set(PROJECT_VERSION "\(.*\)")$/\1/p' CMakeLists.txt | head -n1)"
          if [ -z "$base" ]; then
            echo "Could not determine project version" >&2
            exit 1
          fi
          pkgrel="${{ github.run_number }}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "pkgrel=$pkgrel" >> "$GITHUB_OUTPUT"
          echo "version=$base-$pkgrel" >> "$GITHUB_OUTPUT"
          echo "tag=v${base}-custom-r${pkgrel}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          pacman -Syyuu --noconfirm --needed \
            cmake extra-cmake-modules gettext ninja plasma-wayland-protocols \
            qt6-wayland wayland-protocols pkgconf \
            kcmutils kconfig kcoreaddons kcrash kglobalaccel ki18n \
            kirigami kirigami-addons kitemmodels libplasma \
            qt6-base qt6-declarative qt6-virtualkeyboard

      - name: Build package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "pkgrel=${{ steps.ver.outputs.pkgrel }} bash $GITHUB_WORKSPACE/packaging/build.sh"

      - name: Verify the Qt version stamp
        run: |
          # The app uses Qt's private Gui and WaylandClient APIs, so the package
          # is built against the pinned Qt 6.9 on purpose (see the env comment).
          # A newer stamp installs fine on Arch but cannot load on SteamOS 3.8,
          # so fail the run here instead of publishing such a package.
          set -euo pipefail
          tmp="$(mktemp -d)"
          bsdtar -xf "$(ls -1 packaging/*.pkg.tar.zst | head -n1)" -C "$tmp"
          mapfile -t files < <(find "$tmp" -type f \
            \( -name '*.so' -o -name 'plasma-keyboard-custom' \) | sort)
          if [ "${#files[@]}" -ne 4 ]; then
            echo "expected 4 binaries in the package, found ${#files[@]}" >&2
            printf '  %s\n' "${files[@]}" >&2
            exit 1
          fi
          status=0
          for f in "${files[@]}"; do
            nodes="$(readelf -V "$f" | grep -oE 'Qt_6\.[0-9]+' | sort -u | tr '\n' ' ')"
            printf '%-64s %s\n' "${f#"$tmp"}" "$nodes"
            if ! printf '%s' "$nodes" | grep -q 'Qt_6\.9'; then
              echo "  -> no Qt_6.9 stamp" >&2
              status=1
            fi
            if printf '%s' "$nodes" | grep -qE 'Qt_6\.(1[0-9]|[2-9][0-9])'; then
              echo "  -> built against a Qt newer than the pinned 6.9" >&2
              status=1
            fi
          done
          exit "$status"

      - name: Guard against duplicate packages
        # pkgrel is the workflow run number, so a rebuild of the same
        # sources always gets a new tag but a different tarball sha256:
        # .BUILDINFO/.PKGINFO carry the build metadata and dates and zstd is
        # not byte-stable. A tarball-only comparison could therefore never
        # catch a rebuild. This step hashes the package PAYLOAD - the
        # installed files, without the pacman metadata - and aborts if any
        # previous release already published the same payload (or, for a
        # true byte-identical duplicate, the same tarball). Use the force
        # input to release an intentional rebuild anyway.
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force == 'true' }}
        run: |
          set -euo pipefail

          # The payload hash is essential: pkgrel is the run number, so a rebuild of
          # the same sources always has a different tarball sha256 (build metadata and
          # dates in .BUILDINFO/.PKGINFO, zstd not byte-stable). Do not "simplify" this
          # back to a tarball-only comparison. The same hash is published as the
          # PAYLOAD.sha256 asset; SHA256SUMS is left untouched because install.sh parses
          # it. force=true skips the guard.
          pkg="$(ls -1 packaging/*.pkg.tar.zst | head -n1)"
          if [ -z "$pkg" ]; then
            echo "::error::no packaging/*.pkg.tar.zst to check"
            exit 1
          fi
          pkgname="$(basename "$pkg")"

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          # Deterministic payload hash: extract, then hash the sorted list of relative
          # paths together with the content of every file. Entries are emitted NUL-safe
          # (find -print0 | sort -z) so odd filenames do not change the order, symlinks
          # contribute their target instead of file content, and the pacman metadata
          # files .PKGINFO/.MTREE/.BUILDINFO are skipped.
          bsdtar -xf "$pkg" -C "$tmp"
          payload="$(
            cd "$tmp"
            find . -mindepth 1 \
              ! -name '.PKGINFO' ! -name '.MTREE' ! -name '.BUILDINFO' \
              -print0 |
              LC_ALL=C sort -z |
              while IFS= read -r -d '' path; do
                if [ -L "$path" ]; then
                  printf 'L %s -> %s\n' "$path" "$(readlink "$path")"
                elif [ -d "$path" ]; then
                  printf 'D %s\n' "$path"
                elif [ -f "$path" ]; then
                  printf 'F %s ' "$path"
                  sha256sum < "$path" | cut -d' ' -f1
                fi
              done | sha256sum | cut -d' ' -f1
          )"
          tarball="$(sha256sum "$pkg" | cut -d' ' -f1)"

          # Publish our payload hash for the next run. Keep the sha256sum format so it can
          # be grepped like SHA256SUMS; do NOT append it to SHA256SUMS, whose exact
          # contents install.sh relies on.
          printf '%s  %s\n' "$payload" "$pkgname" > packaging/PAYLOAD.sha256
          echo "Package:      $pkgname"
          echo "Tarball hash: $tarball"
          echo "Payload hash: $payload"

          if [ "${FORCE:-false}" = "true" ]; then
            echo "force=true: skipping the duplicate-package guard."
            exit 0
          fi

          # install.sh does not need jq; curl+jq are only for this guard. The base-devel
          # image ships neither, so install them like the dispatch step installs curl.
          pacman -S --noconfirm --needed curl jq >/dev/null

          # One page of the newest releases is plenty; drafts are not published so they
          # are skipped. Every release with a SHA256SUMS and/or a PAYLOAD.sha256 asset
          # contributes candidate hashes; releases without them (published before this
          # guard existed) are tolerated.
          api="https://api.github.com/repos/${GH_REPO}/releases?per_page=100"
          if ! curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" -o "$tmp/releases.json"; then
            echo "::error::could not list the published releases; refusing to skip the duplicate guard."
            exit 1
          fi

          jq -r '.[] | select(.draft | not) | .tag_name as $t
                 | .assets[] | select(.name == "SHA256SUMS" or .name == "PAYLOAD.sha256")
                 | [$t, .name, .browser_download_url] | @tsv' \
            "$tmp/releases.json" > "$tmp/assets.tsv"

          match_payload=""
          match_tarball=""
          while IFS=$'\t' read -r tag name url; do
            [ -n "$tag" ] || continue
            case "$name" in
              PAYLOAD.sha256 | SHA256SUMS) ;;
              *) continue ;;
            esac
            dest="$tmp/${tag}.${name}"
            if ! curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" -o "$dest"; then
              echo "::error::could not download $name of release $tag; refusing to skip the duplicate guard."
              exit 1
            fi
            # A hash match is exact and anchored: another hash that merely contains ours
            # (or a filename) must not abort the build.
            case "$name" in
              PAYLOAD.sha256)
                if grep -qE "^${payload}([[:space:]]|$)" "$dest"; then
                  match_payload="$tag"
                fi
                ;;
              SHA256SUMS)
                if grep -qE "^${tarball}([[:space:]]|$)" "$dest"; then
                  match_tarball="$tag"
                fi
                ;;
            esac
          done < "$tmp/assets.tsv"

          if [ -n "$match_payload" ] || [ -n "$match_tarball" ]; then
            if [ -n "$match_payload" ]; then
              echo "::error::the installed payload of $pkgname is already published by release $match_payload"
            fi
            if [ -n "$match_tarball" ]; then
              echo "::error::$pkgname is byte-identical to the package published by release $match_tarball"
            fi
            echo "There is no point releasing what is already released; aborting (use force=true to release anyway)." >&2
            exit 1
          fi

          echo "No previous release publishes this payload or tarball; continuing."

      - name: Create checksums
        run: |
          cd packaging
          sha256sum *.pkg.tar.zst > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plasma-keyboard-custom
          path: |
            packaging/*.pkg.tar.zst
            packaging/SHA256SUMS
            packaging/PAYLOAD.sha256

      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          # The tag of this run does not exist yet, so the newest matching tag is
          # the previous release. Fall back to the older tag scheme / first commit.
          prev="$(git tag --list 'v*-custom-r*' --sort=-v:refname | head -n1)"
          if [ -z "$prev" ]; then
            prev="$(git tag --list 'v*-custom' --sort=-v:refname | head -n1)"
          fi
          if [ -z "$prev" ]; then
            prev="$(git rev-list --max-parents=0 HEAD)"
          fi
          echo "previous=$prev" >> "$GITHUB_OUTPUT"

          {
            echo "Arch package for **plasma-keyboard-custom ${{ steps.ver.outputs.version }}**"
            echo "(fork of the KDE Plasma Keyboard, based on the ${{ steps.ver.outputs.base }} sources)."
            echo
            echo "### Install"
            echo
            echo '```sh'
            echo "sudo pacman -U plasma-keyboard-custom-*.pkg.tar.zst"
            echo '```'
            echo
            echo "### Changes since \`${prev}\`"
            echo
            if [ "$(git rev-list --count "$prev..HEAD")" -eq 0 ]; then
              echo "- No changes, rebuilt only."
            else
              git log --no-merges --pretty='- %s (%h)' "$prev..HEAD"
            fi
            echo
            echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/${prev}...${{ steps.ver.outputs.tag }}"
          } > release-notes.md

          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: plasma-keyboard-custom ${{ steps.ver.outputs.version }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          body_path: release-notes.md
          files: |
            packaging/*.pkg.tar.zst
            packaging/SHA256SUMS
            packaging/PAYLOAD.sha256

      - name: Update the pacman repository
        # A release published with the default GITHUB_TOKEN does not trigger
        # other workflows, so "release: published" in deploy-repo.yml never
        # fires on its own. Dispatch it explicitly instead, with the tag of the
        # release that was just published; workflow_dispatch is one of the two
        # events the token restriction does not apply to.
        run: |
          set -euo pipefail
          pacman -S --noconfirm --needed curl >/dev/null
          tag="${{ steps.ver.outputs.tag }}"
          code="$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-repo.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"tag\":\"$tag\"}}")"
          if [ "$code" != "204" ]; then
            echo "Could not dispatch the pacman repository workflow (HTTP $code):" >&2
            cat /tmp/dispatch.json >&2
            exit 1
          fi
          echo "Dispatched the pacman repository workflow for $tag"
