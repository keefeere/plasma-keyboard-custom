# Build the Arch package and publish a GitHub release.
# Run it manually from the Actions tab ("Run workflow").
#
# The version is set automatically for every run:
#   pkgver = PROJECT_VERSION from CMakeLists.txt (e.g. 6.7.90)
#   pkgrel = one more than the highest pkgrel already released for that pkgver
#            (r12 -> r13). It is derived from the tags rather than from the
#            workflow run number, so a failed run does not burn a number: the
#            next one reuses it.
#   tag    = v<pkgver>-custom-r<pkgrel> (e.g. v6.7.90-custom-r12)
name: Build and Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        required: false
        default: false
      force:
        description: 'Skip the duplicate-package guard and release even if this exact payload was already published'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Two runs must not pick the same pkgrel: the tags they read only change once a
# release is published. A queued run waits instead of being cancelled.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    # The tag is passed on to the package-repository job below; it is computed
    # inside this job's steps, so it has to be republished as a job output.
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    env:
      # Arch Linux Archive snapshot matching SteamOS 3.8 (Qt 6.9.1-5, KF6
      # 6.16.0, libplasma/Plasma 6.4.3). The build is pinned to Qt 6.9 because
      # the app uses Qt's private Gui and WaylandClient APIs, whose ABI is not
      # stable across Qt minor releases: SteamOS 3.8 ships Qt 6.9, so the
      # artefacts must be stamped Qt_6.9 and bind the exact private symbols Qt
      # 6.9 exports. A rolling container would stamp them Qt_6.11 (which SteamOS
      # rejects), and building against Qt 6.7/6.8 produces private symbols that
      # no longer exist in 6.9.
      ARCH_SNAPSHOT_DATE: '2025/07/28'
    container:
      image: archlinux:base-devel
    steps:
      - name: Pin package snapshot
        run: |
          printf 'Server = https://archive.archlinux.org/repos/%s/$repo/os/$arch\n' \
            "$ARCH_SNAPSHOT_DATE" > /etc/pacman.d/mirrorlist
          cat /etc/pacman.d/mirrorlist

      - name: Downgrade to the snapshot
        run: |
          # -Syyuu downgrades the whole rolling base-devel image to the pinned
          # snapshot, not just the newly needed packages. The image's keyring
          # has keys that signed the snapshot's packages disabled (e.g. the key
          # behind `base`, which fails with "is disabled"), so signature checks
          # are off while the rollback runs: the keyring is downgraded along with
          # everything else and verification is restored right afterwards, so
          # every later install is still checked.
          cp /etc/pacman.conf /etc/pacman.conf.orig
          sed -i 's/^SigLevel.*/SigLevel = Never/' /etc/pacman.conf
          # --overwrite: the image is newer than the snapshot and has packages the
          # snapshot predates (libstdc++/liblsan/libobjc/... split out of gcc-libs,
          # libmakepkg-dropins out of pacman), whose files the snapshot's monolithic
          # packages have to take back.
          pacman -Syyuu --noconfirm --needed --overwrite '*' git
          mv /etc/pacman.conf.orig /etc/pacman.conf
          # The image's keyring has no secret key, so pacman-key refuses to
          # local-sign anything ("There is no secret key available to sign
          # with"). --init creates the master key, --populate then imports the
          # snapshot's keys and signs them again, which also clears the disabled
          # flags that made the first rollback attempt fail on `base`.
          pacman-key --init
          pacman-key --populate archlinux
          # The build step chowns the workspace to an unprivileged user, which
          # makes git refuse to work here afterwards ("dubious ownership").
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: ver
        run: |
          base="$(sed -n 's/^set(PROJECT_VERSION "\(.*\)")$/\1/p' CMakeLists.txt | head -n1)"
          if [ -z "$base" ]; then
            echo "Could not determine project version" >&2
            exit 1
          fi
          # The checkout fetches all tags (fetch-depth: 0), so the highest
          # pkgrel released for this pkgver is available here. Deriving it from
          # the tags keeps the numbering dense: a failed run consumes nothing.
          last="$(git tag --list "v${base}-custom-r*" --sort=-v:refname | head -n1)"
          if [ -n "$last" ]; then
            pkgrel=$(( ${last##*-r} + 1 ))
          else
            pkgrel=1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "pkgrel=$pkgrel" >> "$GITHUB_OUTPUT"
          echo "version=$base-$pkgrel" >> "$GITHUB_OUTPUT"
          echo "tag=v${base}-custom-r${pkgrel}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          # layer-shell-qt is needed at build time: makepkg runs with --nodeps,
          # so everything the CMake configure step looks for has to be here.
          pacman -Syyuu --noconfirm --needed --overwrite '*' \
            cmake extra-cmake-modules gettext ninja plasma-wayland-protocols \
            qt6-wayland wayland-protocols pkgconf \
            kcmutils kconfig kcoreaddons kcrash kglobalaccel ki18n \
            kirigami kirigami-addons kitemmodels layer-shell-qt libplasma \
            qt6-base qt6-declarative qt6-virtualkeyboard
          # Report what actually landed: if the snapshot pinning ever stops
          # working, the Qt stamp guard below fails the run, and this is the
          # line that says why.
          pacman -Q qt6-base qt6-declarative qt6-wayland qt6-virtualkeyboard

      - name: Build package
        run: |
          # Never sign: CI has no secret key and makepkg aborts with "There is
          # no secret key available to sign with". The image's makepkg.conf is
          # not necessarily the Arch default (and the rollback may have left a
          # mixture), so the flag is set explicitly.
          sed -i 's/^BUILDENV=.*/BUILDENV=(!distcc color !ccache check !sign)/' /etc/makepkg.conf
          grep '^BUILDENV=' /etc/makepkg.conf
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "pkgrel=${{ steps.ver.outputs.pkgrel }} bash $GITHUB_WORKSPACE/packaging/build.sh"

      - name: Verify the Qt version stamp
        run: |
          # The app uses Qt's private Gui and WaylandClient APIs, so the package
          # is built against the pinned Qt 6.9 on purpose (see the env comment).
          # A newer stamp installs fine on Arch but cannot load on SteamOS 3.8,
          # so fail the run here instead of publishing such a package.
          set -euo pipefail
          tmp="$(mktemp -d)"
          bsdtar -xf "$(ls -1 packaging/*.pkg.tar.zst | head -n1)" -C "$tmp"
          mapfile -t files < <(find "$tmp" -type f \
            \( -name '*.so' -o -name 'plasma-keyboard-custom' \) | sort)
          if [ "${#files[@]}" -ne 4 ]; then
            echo "expected 4 binaries in the package, found ${#files[@]}" >&2
            printf '  %s\n' "${files[@]}" >&2
            exit 1
          fi
          status=0
          for f in "${files[@]}"; do
            nodes="$(readelf -V "$f" | grep -oE 'Qt_6\.[0-9]+' | sort -u | tr '\n' ' ')"
            printf '%-64s %s\n' "${f#"$tmp"}" "$nodes"
            if ! printf '%s' "$nodes" | grep -q 'Qt_6\.9'; then
              echo "  -> no Qt_6.9 stamp" >&2
              status=1
            fi
            if printf '%s' "$nodes" | grep -qE 'Qt_6\.(1[0-9]|[2-9][0-9])'; then
              echo "  -> built against a Qt newer than the pinned 6.9" >&2
              status=1
            fi
          done
          exit "$status"

      - name: Guard against duplicate packages
        # pkgrel is the workflow run number, so a rebuild of the same
        # sources always gets a new tag but a different tarball sha256:
        # .BUILDINFO/.PKGINFO carry the build metadata and dates and zstd is
        # not byte-stable. A tarball-only comparison could therefore never
        # catch a rebuild. This step hashes the package PAYLOAD - the
        # installed files, without the pacman metadata - and aborts if any
        # previous release already published the same payload (or, for a
        # true byte-identical duplicate, the same tarball). Use the force
        # input to release an intentional rebuild anyway.
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force == 'true' }}
        run: |
          set -euo pipefail

          # The payload hash is essential: pkgrel is the run number, so a rebuild of
          # the same sources always has a different tarball sha256 (build metadata and
          # dates in .BUILDINFO/.PKGINFO, zstd not byte-stable). Do not "simplify" this
          # back to a tarball-only comparison. The same hash is published as the
          # PAYLOAD.sha256 asset; SHA256SUMS is left untouched because install.sh parses
          # it. force=true skips the guard.
          pkg="$(ls -1 packaging/*.pkg.tar.zst | head -n1)"
          if [ -z "$pkg" ]; then
            echo "::error::no packaging/*.pkg.tar.zst to check"
            exit 1
          fi
          pkgname="$(basename "$pkg")"

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          # Deterministic payload hash: extract, then hash the sorted list of relative
          # paths together with the content of every file. Entries are emitted NUL-safe
          # (find -print0 | sort -z) so odd filenames do not change the order, symlinks
          # contribute their target instead of file content, and the pacman metadata
          # files .PKGINFO/.MTREE/.BUILDINFO are skipped.
          bsdtar -xf "$pkg" -C "$tmp"
          payload="$(
            cd "$tmp"
            find . -mindepth 1 \
              ! -name '.PKGINFO' ! -name '.MTREE' ! -name '.BUILDINFO' \
              -print0 |
              LC_ALL=C sort -z |
              while IFS= read -r -d '' path; do
                if [ -L "$path" ]; then
                  printf 'L %s -> %s\n' "$path" "$(readlink "$path")"
                elif [ -d "$path" ]; then
                  printf 'D %s\n' "$path"
                elif [ -f "$path" ]; then
                  printf 'F %s ' "$path"
                  sha256sum < "$path" | cut -d' ' -f1
                fi
              done | sha256sum | cut -d' ' -f1
          )"
          tarball="$(sha256sum "$pkg" | cut -d' ' -f1)"

          # Publish our payload hash for the next run. Keep the sha256sum format so it can
          # be grepped like SHA256SUMS; do NOT append it to SHA256SUMS, whose exact
          # contents install.sh relies on.
          printf '%s  %s\n' "$payload" "$pkgname" > packaging/PAYLOAD.sha256
          echo "Package:      $pkgname"
          echo "Tarball hash: $tarball"
          echo "Payload hash: $payload"

          if [ "${FORCE:-false}" = "true" ]; then
            echo "force=true: skipping the duplicate-package guard."
            exit 0
          fi

          # install.sh does not need jq; curl+jq are only for this guard. The
          # base-devel image ships neither, so install them here.
          pacman -S --noconfirm --needed curl jq >/dev/null

          # One page of the newest releases is plenty; drafts are not published so they
          # are skipped. Every release with a SHA256SUMS and/or a PAYLOAD.sha256 asset
          # contributes candidate hashes; releases without them (published before this
          # guard existed) are tolerated.
          api="https://api.github.com/repos/${GH_REPO}/releases?per_page=100"
          if ! curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" -o "$tmp/releases.json"; then
            echo "::error::could not list the published releases; refusing to skip the duplicate guard."
            exit 1
          fi

          jq -r '.[] | select(.draft | not) | .tag_name as $t
                 | .assets[] | select(.name == "SHA256SUMS" or .name == "PAYLOAD.sha256")
                 | [$t, .name, .browser_download_url] | @tsv' \
            "$tmp/releases.json" > "$tmp/assets.tsv"

          match_payload=""
          match_tarball=""
          while IFS=$'\t' read -r tag name url; do
            [ -n "$tag" ] || continue
            case "$name" in
              PAYLOAD.sha256 | SHA256SUMS) ;;
              *) continue ;;
            esac
            dest="$tmp/${tag}.${name}"
            if ! curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" -o "$dest"; then
              echo "::error::could not download $name of release $tag; refusing to skip the duplicate guard."
              exit 1
            fi
            # A hash match is exact and anchored: another hash that merely contains ours
            # (or a filename) must not abort the build.
            case "$name" in
              PAYLOAD.sha256)
                if grep -qE "^${payload}([[:space:]]|$)" "$dest"; then
                  match_payload="$tag"
                fi
                ;;
              SHA256SUMS)
                if grep -qE "^${tarball}([[:space:]]|$)" "$dest"; then
                  match_tarball="$tag"
                fi
                ;;
            esac
          done < "$tmp/assets.tsv"

          if [ -n "$match_payload" ] || [ -n "$match_tarball" ]; then
            if [ -n "$match_payload" ]; then
              echo "::error::the installed payload of $pkgname is already published by release $match_payload"
            fi
            if [ -n "$match_tarball" ]; then
              echo "::error::$pkgname is byte-identical to the package published by release $match_tarball"
            fi
            echo "There is no point releasing what is already released; aborting (use force=true to release anyway)." >&2
            exit 1
          fi

          echo "No previous release publishes this payload or tarball; continuing."

      - name: Create checksums
        run: |
          cd packaging
          sha256sum *.pkg.tar.zst > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plasma-keyboard-custom
          path: |
            packaging/*.pkg.tar.zst
            packaging/SHA256SUMS
            packaging/PAYLOAD.sha256

      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          # The tag of this run does not exist yet, so the newest matching tag is
          # the previous release. Fall back to the older tag scheme / first commit.
          prev="$(git tag --list 'v*-custom-r*' --sort=-v:refname | head -n1)"
          if [ -z "$prev" ]; then
            prev="$(git tag --list 'v*-custom' --sort=-v:refname | head -n1)"
          fi
          if [ -z "$prev" ]; then
            prev="$(git rev-list --max-parents=0 HEAD)"
          fi
          echo "previous=$prev" >> "$GITHUB_OUTPUT"

          {
            echo "Arch package for **plasma-keyboard-custom ${{ steps.ver.outputs.version }}**"
            echo "(fork of the KDE Plasma Keyboard, based on the ${{ steps.ver.outputs.base }} sources)."
            echo
            echo "### Install"
            echo
            echo '```sh'
            echo "sudo pacman -U plasma-keyboard-custom-*.pkg.tar.zst"
            echo '```'
            echo
            echo "### Changes since \`${prev}\`"
            echo
            if [ "$(git rev-list --count "$prev..HEAD")" -eq 0 ]; then
              echo "- No changes, rebuilt only."
            else
              git log --no-merges --pretty='- %s (%h)' "$prev..HEAD"
            fi
            echo
            echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/${prev}...${{ steps.ver.outputs.tag }}"
          } > release-notes.md

          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        # A transient asset-save failure must not strand the release: the
        # reconcile step below repairs it before the repository job runs.
        continue-on-error: true
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: plasma-keyboard-custom ${{ steps.ver.outputs.version }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          body_path: release-notes.md
          files: |
            packaging/*.pkg.tar.zst
            packaging/SHA256SUMS
            packaging/PAYLOAD.sha256

      - name: Verify and repair release assets
        # A transient "Error saving asset" from softprops/action-gh-release (seen
        # when GitHub's API lags right after the release is created) fails the
        # publish step after the release exists but before the "publish-repo" job
        # indexes it. That leaves the pacman repo serving the previous package
        # although a new one was published, so the publish step is allowed to
        # continue and this step reconciles the release against what the run
        # actually built. A genuine problem still fails loudly, here, before that
        # job runs.
        run: |
          set -euo pipefail

          # force=true skips the duplicate-package guard, which is the step that
          # normally installs curl/jq, so install them here to be self-contained.
          pacman -S --noconfirm --needed curl jq >/dev/null

          repo="${{ github.repository }}"
          tag="${{ steps.ver.outputs.tag }}"
          version="${{ steps.ver.outputs.version }}"
          prerelease="${{ github.event.inputs.prerelease == 'true' }}"
          api="https://api.github.com/repos/${repo}"
          auth=(-H "Authorization: Bearer ${{ github.token }}"
                -H "Accept: application/vnd.github+json"
                -H "X-GitHub-Api-Version: 2022-11-28")

          # The duplicate guard runs on every build and always writes
          # PAYLOAD.sha256, so all three assets are required: a missing local
          # file means an earlier step went wrong, not that the asset is optional.
          files=()
          for f in packaging/*.pkg.tar.zst packaging/SHA256SUMS packaging/PAYLOAD.sha256; do
            if [ ! -f "$f" ]; then
              echo "::error::expected build asset $f is missing" >&2
              exit 1
            fi
            files+=("$f")
          done
          if [ "${#files[@]}" -ne 3 ]; then
            echo "::error::expected 3 release assets, found ${#files[@]}: ${files[*]}" >&2
            exit 1
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          # GET helper: record the HTTP status in HTTP_CODE instead of aborting on
          # a non-2xx, so callers can tell 404 (no release yet) from a real error.
          HTTP_CODE=""
          api_get() {
            HTTP_CODE="$(curl -sS -o "$2" -w '%{http_code}' "${auth[@]}" "$1")" || HTTP_CODE=000
          }

          # Fetch this tag's release. Retry 404 briefly: right after creation the
          # tag can take a moment to become discoverable through the API.
          release_json="$tmp/release.json"
          for attempt in 1 2 3 4 5; do
            api_get "$api/releases/tags/$tag" "$release_json"
            if [ "$HTTP_CODE" != "404" ]; then
              break
            fi
            sleep 2
          done

          if [ "$HTTP_CODE" = "404" ]; then
            # No release at all: the publish step may have failed before it was
            # created, so recreate it from this run's generated release notes.
            jq -n \
              --arg tag "$tag" \
              --arg name "plasma-keyboard-custom $version" \
              --rawfile body release-notes.md \
              --argjson prerelease "$prerelease" \
              '{tag_name: $tag, name: $name, body: $body, prerelease: $prerelease}' \
              > "$tmp/create.json"
            HTTP_CODE="$(curl -sS -o "$release_json" -w '%{http_code}' "${auth[@]}" \
              -X POST "$api/releases" --data-binary @"$tmp/create.json")" || HTTP_CODE=000
            if [ "$HTTP_CODE" = "422" ]; then
              # Lost a race: the release appeared between the lookup and the
              # create. Re-fetch it instead of treating that as fatal.
              for attempt in 1 2 3 4 5; do
                sleep 2
                api_get "$api/releases/tags/$tag" "$release_json"
                if [ "$HTTP_CODE" = "200" ]; then
                  break
                fi
              done
            fi
            if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
              echo "::error::could not create or find release $tag (HTTP $HTTP_CODE):" >&2
              cat "$release_json" >&2
              exit 1
            fi
            echo "$tag: release created"
          elif [ "$HTTP_CODE" != "200" ]; then
            echo "::error::could not look up release $tag (HTTP $HTTP_CODE):" >&2
            cat "$release_json" >&2
            exit 1
          fi

          # upload_url comes back as .../assets{?name,label}; strip the template
          # and pass the URL-encoded name as the query parameter on upload.
          upload_url="$(jq -r '.upload_url // empty' "$release_json" | sed 's/{?name,label}$//')"
          if [ -z "$upload_url" ]; then
            echo "::error::release $tag has no upload_url" >&2
            exit 1
          fi

          repaired=0
          uploaded=0
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            want="$(stat -c '%s' "$f")"
            enc="$(jq -rn --arg s "$name" '$s|@uri')"
            aid="$(jq -r --arg n "$name" '[.assets[]? | select(.name == $n)][0].id // empty' "$release_json")"
            have="$(jq -r --arg n "$name" '[.assets[]? | select(.name == $n)][0].size // empty' "$release_json")"

            if [ -n "$aid" ] && [ "$have" = "$want" ]; then
              echo "$name: present ($want bytes)"
              continue
            fi

            if [ -n "$aid" ]; then
              echo "$name: wrong size ($have != $want), replacing"
              HTTP_CODE="$(curl -sS -o "$tmp/delete.json" -w '%{http_code}' "${auth[@]}" \
                -X DELETE "$api/releases/assets/$aid")" || HTTP_CODE=000
              if [ "$HTTP_CODE" != "204" ]; then
                echo "::error::could not delete stale asset $name (HTTP $HTTP_CODE):" >&2
                cat "$tmp/delete.json" >&2
                exit 1
              fi
              repaired=$((repaired + 1))
            else
              echo "$name: missing, uploading"
              uploaded=$((uploaded + 1))
            fi

            HTTP_CODE="$(curl -sS -o "$tmp/upload.json" -w '%{http_code}' "${auth[@]}" \
              -X POST \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" \
              "$upload_url?name=$enc")" || HTTP_CODE=000
            if [ "$HTTP_CODE" != "201" ]; then
              echo "::error::could not upload $name (HTTP $HTTP_CODE):" >&2
              cat "$tmp/upload.json" >&2
              exit 1
            fi
            echo "$name: uploaded ($want bytes)"
          done

          # Verify against a fresh view of the release. The asset listing can lag
          # a moment behind an upload, so retry briefly before giving up.
          status=1
          for attempt in 1 2 3 4 5; do
            api_get "$api/releases/tags/$tag" "$tmp/final.json"
            if [ "$HTTP_CODE" != "200" ]; then
              sleep 2
              continue
            fi
            status=0
            for f in "${files[@]}"; do
              name="$(basename "$f")"
              want="$(stat -c '%s' "$f")"
              have="$(jq -r --arg n "$name" '[.assets[]? | select(.name == $n)][0].size // empty' "$tmp/final.json")"
              if [ "$have" != "$want" ]; then
                echo "$name: not published correctly (release: ${have:-missing}, expected: $want)" >&2
                status=1
              fi
            done
            if [ "$status" = "0" ]; then
              break
            fi
            sleep 2
          done

          if [ "$status" != "0" ]; then
            echo "::error::release $tag does not match the build; assets are still missing or truncated" >&2
            exit 1
          fi
          echo "$tag: release verified, 3/3 assets match (repaired $repaired, uploaded $uploaded)"

  # The package repository has to follow the release: a release that never
  # reaches gh-pages leaves pacman serving the previous package. GitHub starts
  # no workflows for events created with the default GITHUB_TOKEN, so
  # deploy-repo.yml cannot fire on "release: published" here. Calling it as a
  # reusable workflow runs it inside this run instead, where it is awaited:
  # its failure fails this run rather than only the separate one it used to be
  # dispatched into.
  publish-repo:
    name: Update pacman repository
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-repo.yml
    with:
      tag: ${{ needs.build.outputs.tag }}

  # Fedora and Bazzite packages. The app uses Qt's private Gui/WaylandClient
  # APIs, whose ABI is only valid for the Qt minor it was built against, so the
  # package is built separately per Qt branch: Fedora 43 ships Qt 6.10, Fedora
  # 44/45 ship Qt 6.11. Bazzite follows Fedora, so these two packages cover it
  # too. A failure here fails the run but leaves the Arch package and the pacman
  # repository untouched (they are built by the jobs above).
  rpm:
    name: Build rpm (Fedora ${{ matrix.fedora }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: ['43', '44']
    container:
      image: fedora:${{ matrix.fedora }}
    steps:
      - name: Install rpm-build
        run: dnf install -y --setopt=install_weak_deps=False rpm-build dnf5-plugins git tar

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # The BuildRequires of the spec are the single source of truth: the
          # list is not duplicated here, so adding a dependency there is enough.
          dnf builddep -y packaging/rpm/plasma-keyboard-custom.spec

      - name: Build the package
        run: |
          # rpmbuild runs as an unprivileged user, the same way the Arch build
          # above does: the workspace has to change hands for that, hence the
          # safe.directory entry (git refuses a repository owned by someone
          # else).
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "bash $GITHUB_WORKSPACE/packaging/rpm/build.sh"

      - name: Verify the package
        run: |
          set -euo pipefail
          main="$(ls -1 packaging/plasma-keyboard-custom-[0-9]*.rpm | head -n1)"
          kcm="$(ls -1 packaging/kcm-plasma-keyboard-custom-*.rpm | head -n1)"
          rpm -qp --qf 'built %{NAME} %{VERSION}-%{RELEASE} (%{ARCH})\n' "$main"
          rpm -qpl "$main" | grep -qx '/usr/bin/plasma-keyboard-custom'
          rpm -qpl "$main" | grep -q 'VirtualKeyboard/Styles/PlasmaBreezeCustom/style.qml'
          rpm -qpl "$kcm" | grep -q 'kcm_plasmakeyboardcustom.so'

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: rpm-fc${{ matrix.fedora }}
          path: packaging/*.rpm

  # Flatpak bundle for every distribution: it carries its own Qt and KDE stack,
  # so it does not depend on the versions of the host. Built for
  # org.kde.Platform//6.10, the newest runtime with a ready flathub builder image
  # (ghcr.io/flathub-infra/flatpak-github-actions has no kde-6.11 tag yet); the
  # KCM does not reach the system settings of the host, so the settings of the
  # flatpak are the ones built into the keyboard itself.
  flatpak:
    name: Build flatpak
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the bundle
        run: |
          set -euo pipefail
          flatpak-builder --repo=repo --force-clean --disable-rofiles-fuse \
            build-dir .flatpak/org.kde.plasma.keyboard.custom.json
          flatpak build-bundle repo \
            "plasma-keyboard-custom-${{ needs.build.outputs.version }}.flatpak" \
            org.kde.plasma.keyboard.custom stable
          ls -l plasma-keyboard-custom-*.flatpak

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: plasma-keyboard-custom-*.flatpak

  # The extra assets are attached to the release the "build" job created. The
  # job still runs when one of the extra packages failed, so a broken flatpak
  # does not keep a good rpm (and vice versa) out of the release; a failure of
  # "build" itself skips it, because then there is no release to attach to.
  publish-extra:
    name: Publish rpm and flatpak
    needs: [build, rpm, flatpak]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the rpm packages
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: 'rpm-*'
          merge-multiple: true
          path: dist

      - name: Download the flatpak bundle
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: flatpak
          path: dist

      - name: Create checksums
        run: |
          set -euo pipefail
          cd dist 2>/dev/null || { echo "no extra packages were built"; exit 0; }
          ls -l
          # Separate files: install.sh parses the plain SHA256SUMS of the Arch
          # package, so it is left exactly as the build job wrote it.
          if ls -1 ./*.rpm >/dev/null 2>&1; then
            sha256sum ./*.rpm > SHA256SUMS.rpm
            cat SHA256SUMS.rpm
          fi
          if ls -1 ./*.flatpak >/dev/null 2>&1; then
            sha256sum ./*.flatpak > SHA256SUMS.flatpak
            cat SHA256SUMS.flatpak
          fi

      - name: Publish the assets
        if: ${{ hashFiles('dist/*.rpm', 'dist/*.flatpak') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            dist/*.rpm
            dist/*.flatpak
            dist/SHA256SUMS.rpm
            dist/SHA256SUMS.flatpak
