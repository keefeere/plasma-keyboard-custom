# Build the Arch package and publish a GitHub release.
# Run it manually from the Actions tab ("Run workflow").
#
# The version is set automatically for every run:
#   pkgver = PROJECT_VERSION from CMakeLists.txt (e.g. 6.7.90)
#   pkgrel = workflow run number (monotonically increasing, so pacman
#            always sees an upgrade)
#   tag    = v<pkgver>-custom-r<pkgrel> (e.g. v6.7.90-custom-r12)
name: Build and Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install git
        run: pacman -Sy --noconfirm --needed git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: ver
        run: |
          base="$(sed -n 's/^set(PROJECT_VERSION "\(.*\)")$/\1/p' CMakeLists.txt | head -n1)"
          if [ -z "$base" ]; then
            echo "Could not determine project version" >&2
            exit 1
          fi
          pkgrel="${{ github.run_number }}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "pkgrel=$pkgrel" >> "$GITHUB_OUTPUT"
          echo "version=$base-$pkgrel" >> "$GITHUB_OUTPUT"
          echo "tag=v${base}-custom-r${pkgrel}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          pacman -S --noconfirm --needed \
            cmake extra-cmake-modules gettext ninja plasma-wayland-protocols \
            qt6-wayland wayland-protocols pkgconf \
            kcmutils kconfig kcoreaddons kcrash kglobalaccel ki18n \
            kirigami kirigami-addons kitemmodels libplasma \
            qt6-base qt6-declarative qt6-virtualkeyboard

      - name: Build package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "pkgrel=${{ steps.ver.outputs.pkgrel }} bash $GITHUB_WORKSPACE/packaging/build.sh"

      - name: Create checksums
        run: |
          cd packaging
          sha256sum *.pkg.tar.zst > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plasma-keyboard-custom
          path: |
            packaging/*.pkg.tar.zst
            packaging/SHA256SUMS

      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          # The tag of this run does not exist yet, so the newest matching tag is
          # the previous release. Fall back to the older tag scheme / first commit.
          prev="$(git tag --list 'v*-custom-r*' --sort=-v:refname | head -n1)"
          if [ -z "$prev" ]; then
            prev="$(git tag --list 'v*-custom' --sort=-v:refname | head -n1)"
          fi
          if [ -z "$prev" ]; then
            prev="$(git rev-list --max-parents=0 HEAD)"
          fi
          echo "previous=$prev" >> "$GITHUB_OUTPUT"

          {
            echo "Arch package for **plasma-keyboard-custom ${{ steps.ver.outputs.version }}**"
            echo "(fork of the KDE Plasma Keyboard, based on the ${{ steps.ver.outputs.base }} sources)."
            echo
            echo "### Install"
            echo
            echo '```sh'
            echo "sudo pacman -U plasma-keyboard-custom-*.pkg.tar.zst"
            echo '```'
            echo
            echo "### Changes since \`${prev}\`"
            echo
            if [ "$(git rev-list --count "$prev..HEAD")" -eq 0 ]; then
              echo "- No changes, rebuilt only."
            else
              git log --no-merges --pretty='- %s (%h)' "$prev..HEAD"
            fi
            echo
            echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/${prev}...${{ steps.ver.outputs.tag }}"
          } > release-notes.md

          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: plasma-keyboard-custom ${{ steps.ver.outputs.version }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          body_path: release-notes.md
          files: |
            packaging/*.pkg.tar.zst
            packaging/SHA256SUMS
