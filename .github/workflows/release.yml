# Build the Arch package and publish a GitHub release.
# Run it manually from the Actions tab ("Run workflow").
name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (created if it does not exist). Empty -> v<version>-custom'
        required: false
        default: ''
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install git
        run: pacman -Sy --noconfirm --needed git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and tag
        id: ver
        run: |
          version="$(sed -n 's/^set(PROJECT_VERSION "\(.*\)")$/\1/p' CMakeLists.txt | head -n1)"
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="v${version}-custom"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          pacman -S --noconfirm --needed \
            cmake extra-cmake-modules ninja plasma-wayland-protocols \
            qt6-wayland wayland-protocols pkgconf \
            kcmutils kconfig kcoreaddons kcrash kglobalaccel ki18n \
            kirigami kirigami-addons kitemmodels libplasma \
            qt6-base qt6-declarative qt6-virtualkeyboard

      - name: Build package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "bash $GITHUB_WORKSPACE/packaging/build.sh"

      - name: Create checksums
        run: |
          cd packaging
          sha256sum *.pkg.tar.zst > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plasma-keyboard-custom
          path: |
            packaging/*.pkg.tar.zst
            packaging/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: plasma-keyboard-custom ${{ steps.ver.outputs.version }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            packaging/*.pkg.tar.zst
            packaging/SHA256SUMS
