# Maintain the pacman repository on the gh-pages branch.
#
# Every published release gets added to the repository, so users can install
# and upgrade the fork with pacman instead of downloading the package by hand:
#
#   [plasma-keyboard-custom]
#   SigLevel = Optional TrustAll
#   Server = https://<owner>.github.io/<repo>/repo/$arch
#
# Enable it once under Settings -> Pages (Source: "Deploy from a branch",
# Branch: gh-pages, Folder: / (root)).
name: Update pacman repository

on:
  # Automatic run: fired by "Publish release" (and by any later manual publish
  # of a draft), which is exactly when the package asset exists.
  release:
    types: [published]
  # Manual run, mostly to repair the repository after a failed deployment or
  # after the branch was lost: without a tag it re-indexes every published
  # release from scratch, with a tag it republishes just that one.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)publish, empty = re-index all releases'
        required: false
        default: ''
        type: string

# The job pushes the updated database back to the same repository.
permissions:
  contents: write

# Two releases must never write the pacman database at the same time: the
# rebase below cannot merge the binary archives. Queued runs are kept instead
# of cancelled, so no published release is silently dropped.
concurrency:
  group: pacman-repository-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish package to gh-pages
    runs-on: ubuntu-latest
    env:
      # Tag of the release that carries the package (release event or manual
      # input). Empty on a manual run without a tag: the repository is then
      # rebuilt from every published release.
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # Base name of the package, and therefore of both pacman databases.
      PKG: plasma-keyboard-custom
      # gh and the git remote authenticate with the workflow token.
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Adopt the gh-pages branch
        run: |
          set -euo pipefail
          # Deliberately no actions/checkout: this job only touches the package
          # repository, and a fresh repository with gh-pages fetched into it
          # keeps the database history without pulling the sources.
          git init --initial-branch=gh-pages .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # The branch may not exist yet (first release ever): then stay on the
          # empty orphan branch, otherwise start from the published state.
          if git fetch --depth=1 origin gh-pages; then
            git reset --hard FETCH_HEAD
            echo "Continuing from the published gh-pages branch."
          else
            echo "gh-pages does not exist yet, initialising an empty branch."
          fi

          # Author of the commits created below.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch the package(s) and verify the checksums
        run: |
          set -euo pipefail
          # gh is preinstalled on the hosted runners; install it if that changes.
          command -v gh >/dev/null || { sudo apt-get update && sudo apt-get install -y gh; }
          mkdir -p repo/x86_64

          fetch() {  # $1 = release tag
            if ! gh release download "$1" \
                 --repo "$GITHUB_REPOSITORY" \
                 --pattern '*.pkg.tar.zst' \
                 --dir repo/x86_64; then
              echo "::warning::$1 carries no package, skipping it."
              return 0
            fi
            # Releases built before the checksum asset existed are accepted too.
            if gh release download "$1" \
                 --repo "$GITHUB_REPOSITORY" \
                 --pattern 'SHA256SUMS' \
                 --clobber \
                 --dir repo/x86_64; then
              ( cd repo/x86_64 && sha256sum -c --ignore-missing SHA256SUMS )
              rm -f repo/x86_64/SHA256SUMS
            else
              echo "::warning::No SHA256SUMS in $1, skipping verification."
            fi
            return 0
          }

          if [ -n "$TAG" ]; then
            # Triggered by a published release: take that release's package.
            fetch "$TAG"
          else
            # Re-index: rebuild the repository from every published release,
            # oldest first, so that the newest package wins in the database
            # (the versions are compared with sort -V, which understands the
            # v<version>-custom-r<run> tags).
            while read -r tag; do
              [ -n "$tag" ] || continue
              echo "::group::Fetching $tag"
              fetch "$tag"
              echo "::endgroup::"
            done < <(gh release list \
                       --repo "$GITHUB_REPOSITORY" \
                       --exclude-drafts \
                       --limit 1000 \
                       --json tagName \
                       --jq '.[].tagName' | sort -V)
          fi
          ls -l repo/x86_64

      - name: Update the pacman database
        run: |
          set -euo pipefail
          # Nothing to publish would mean an empty/broken repository, so fail
          # loudly instead of committing an empty database.
          shopt -s nullglob
          pkgs=(repo/x86_64/*.pkg.tar.zst)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "::error::No package to publish (release ${TAG:-<all>} has none)."
            exit 1
          fi
          echo "Packages to index: ${#pkgs[@]}"

          # repo-add only exists on Arch, so run it in the official container.
          # The packages are handed over in version order (sort -V) and:
          #   -n  add a package unless that exact database entry already
          #       exists (re-running a release is a no-op),
          #   -R  remove the older entries of that package name together with
          #       their package files, so the database advertises the newest
          #       package and the branch does not grow forever.
          docker run --rm \
            -e PKG="$PKG" \
            -v "$PWD/repo:/repo" \
            -w /repo \
            archlinux:latest \
            bash -euo pipefail -c '
              cd x86_64
              mapfile -t pkgs < <(printf "%s\n" *.pkg.tar.zst | sort -V)
              repo-add -n -R "${PKG}.db.tar.gz" "${pkgs[@]}"
            '

          # repo-add runs as root inside the container.
          sudo chown -R "$(id -u):$(id -g)" repo
          ls -l repo/x86_64

      - name: Drop packages that are no longer in the database
        run: |
          set -euo pipefail
          cd repo/x86_64
          # -R already removes the package files of the entries it drops; this
          # pass is the safety net for anything else that ended up in the
          # directory (a hand-uploaded file, a leftover from an interrupted
          # run). Ask the database itself (%FILENAME% of every entry) which
          # packages are still served and delete the rest, so the branch does
          # not grow forever.
          tar --wildcards -xzOf "${PKG}.db.tar.gz" '*/desc' \
            | awk '/^%FILENAME%$/ { getline; print }' \
            | sort -u > /tmp/keep
          echo "Packages still referenced by the database:"; cat /tmp/keep

          # Every entry the database advertises must be downloadable.
          while read -r pkg; do
            [ -n "$pkg" ] || continue
            if [ ! -e "$pkg" ]; then
              echo "::error::The database references $pkg, which is not there."
              exit 1
            fi
          done < /tmp/keep

          for pkg in *.pkg.tar.zst; do
            [ -e "$pkg" ] || continue
            if ! grep -qxF "$pkg" /tmp/keep; then
              echo "Removing obsolete package $pkg"
              rm -f "$pkg"
            fi
          done

          # repo-add keeps the previous database around as *.old; pacman never
          # downloads those, so do not carry them in the branch forever.
          rm -f ./*.old
          ls -l

      - name: Ship real database files instead of symlinks
        run: |
          set -euo pipefail
          cd repo/x86_64
          # repo-add leaves plasma-keyboard-custom.db (and .files) as symlinks
          # to the .tar.gz archives. GitHub Pages does not follow symlinks, so
          # pacman would download the link target as plain text and fail.
          # Ship copies under both names - pacman accepts either of them.
          for db in "${PKG}.db" "${PKG}.files"; do
            rm -f "$db"
            cp "${db}.tar.gz" "$db"
          done
          ls -l

      - name: Commit and push the repository
        run: |
          set -euo pipefail
          # Pages would otherwise run Jekyll over the repository.
          touch .nojekyll
          git add -A

          if git diff --cached --quiet; then
            echo "The repository already contains $TAG, nothing to do."
            exit 0
          fi

          git commit -m "Add ${PKG} ${TAG} to the package repository"

          # The concurrency group keeps parallel deployments apart; this loop
          # additionally survives a push that still loses the race (for example
          # when someone pushes to gh-pages by hand).
          for attempt in 1 2 3; do
            if git push origin gh-pages; then
              echo "Pushed the updated repository to gh-pages."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}), rebasing onto origin/gh-pages."
            git fetch --depth=1 origin gh-pages
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "::error::Conflict while rebasing on gh-pages, re-run the workflow."
              exit 1
            fi
          done

          echo "::error::Could not push the package repository to gh-pages."
          exit 1

      - name: Write the pacman configuration to the job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### pacman repository"
            echo
            echo "Release: \`${TAG:-all published releases (re-index)}\`"
            echo
            echo '```ini'
            echo "[plasma-keyboard-custom]"
            echo "SigLevel = Optional TrustAll"
            echo "Server = https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/repo/\$arch"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
